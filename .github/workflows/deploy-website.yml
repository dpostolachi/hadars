name: Deploy Website

on:
  workflow_dispatch:

env:
  BUNNY_API: "https://api.bunny.net"
  BUNNY_STORAGE_HOST: "storage.bunnycdn.com"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Build hadars ─────────────────────────────────────────────────────────
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install hadars dependencies
        run: bun install --ignore-scripts

      - name: Build hadars
        run: bun run build:all

      # ── Build & bundle the website ───────────────────────────────────────────
      - name: Install website dependencies
        run: npm install --ignore-scripts
        working-directory: website

      - name: Bundle Bunny Edge Script
        # export:bunny swaps in hadars.bunny.config.ts (baseURL pointing at
        # static.hadars.xyz, no `port`) for the duration of the export, then
        # runs `hadars export bunny`, which builds the app and produces a
        # self-contained bunny.mjs — see scripts/export-bunny.sh.
        run: bun run export:bunny
        working-directory: website

      # ── Deploy to bunny.net ──────────────────────────────────────────────────
      # Prerequisites (one-time setup in the bunny.net dashboard):
      #   1. Create a Storage Zone for static assets and a Pull Zone
      #      (static.hadars.xyz) in front of it.
      #   2. Create a Compute Script (Edge Platform → Scripting → Standalone
      #      script) and note its Script ID and Deployment Key.
      #   3. Point hadars.xyz's Pull Zone at the Compute Script.
      #
      # Required secrets:
      #   BUNNY_STORAGE_USER, BUNNY_STORAGE_PASSWORD — Storage Zone SFTP creds
      #   BUNNY_SCRIPT_ID, BUNNY_DEPLOY_KEY           — Compute Script creds
      - name: Install deploy tools
        run: sudo apt-get update && sudo apt-get install -y lftp jq

      - name: Upload static assets to Bunny Storage
        run: |
          lftp -u "$BUNNY_STORAGE_USER,$BUNNY_STORAGE_PASSWORD" sftp://$BUNNY_STORAGE_HOST -e "set sftp:auto-confirm yes; set net:max-retries 3; mirror -R --parallel=8 --no-perms --ignore-time ./.hadars/static /; mirror -R --parallel=8 --no-perms --ignore-time ./static /; bye"
        working-directory: website
        env:
          BUNNY_STORAGE_USER: ${{ secrets.BUNNY_STORAGE_USER }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}

      - name: Upload edge script to Bunny
        run: |
          jq -n --rawfile code bunny.mjs '{Code: $code}' \
            | curl -sf -X POST "${BUNNY_API}/compute/script/${BUNNY_SCRIPT_ID}/code" \
                -H "DeploymentKey: ${BUNNY_DEPLOY_KEY}" \
                -H "Content-Type: application/json" \
                -d @-
        working-directory: website
        env:
          BUNNY_SCRIPT_ID: ${{ secrets.BUNNY_SCRIPT_ID }}
          BUNNY_DEPLOY_KEY: ${{ secrets.BUNNY_DEPLOY_KEY }}

      - name: Publish edge script
        run: |
          curl -sf -X POST "${BUNNY_API}/compute/script/${BUNNY_SCRIPT_ID}/publish" \
            -H "DeploymentKey: ${BUNNY_DEPLOY_KEY}" \
            -H "Content-Type: application/json"
        env:
          BUNNY_SCRIPT_ID: ${{ secrets.BUNNY_SCRIPT_ID }}
          BUNNY_DEPLOY_KEY: ${{ secrets.BUNNY_DEPLOY_KEY }}
