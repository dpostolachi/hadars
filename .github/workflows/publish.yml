name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - rc
      resume_tag:
        description: Existing tag to publish without bumping (e.g. v1.0.20)
        required: false
        type: string

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push version commit + tag
      id-token: write   # npm provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Default GITHUB_TOKEN has push access when contents: write is set
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ inputs.resume_tag || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Check npm authentication
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Bump version in package.json only (no git commit/tag yet).
      # RC uses prerelease versioning (e.g. 0.1.14-rc.0) and publishes
      # under the "next" dist-tag so it doesn't become the default install.
      - name: Bump version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          RESUME_TAG: ${{ inputs.resume_tag }}
        run: |
          if [ -n "$RESUME_TAG" ]; then
            NEW_VERSION="v$(node -p 'require("./package.json").version')"
            if [ "$RESUME_TAG" != "$NEW_VERSION" ] || \
               [ "$(git rev-parse "refs/tags/${RESUME_TAG}^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "Resume tag must match the checked-out package version."
              exit 1
            fi
          elif [ "$BUMP" = "rc" ]; then
            NEW_VERSION=$(npm version prerelease --preid=rc --no-git-tag-version)
          else
            NEW_VERSION=$(npm version "$BUMP" --no-git-tag-version)
          fi
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped to $NEW_VERSION"

      - name: Build
        run: bun run build:all

      - name: Commit, tag, and push
        if: inputs.resume_tag == ''
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          git add package.json
          git commit -m "chore: release $VERSION"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push --atomic origin "HEAD:refs/heads/$RELEASE_BRANCH" "refs/tags/$VERSION"

      - name: Publish to npm
        run: |
          if [ "$VERSION" != "${VERSION%-*}" ]; then
            npm publish --ignore-scripts --provenance --access public --tag next
          else
            npm publish --ignore-scripts --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          if [ "$VERSION" != "${VERSION%-*}" ]; then
            gh release create "$VERSION" --verify-tag \
              --title "RC $VERSION" \
              --generate-notes \
              --prerelease
          else
            gh release create "$VERSION" --verify-tag \
              --title "Release $VERSION" \
              --generate-notes
          fi
